<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Lylow Store - Top Up Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg:#f4f6fb;
  --card:#ffffff;
  --primary:#4f6df5;
  --text:#2b2b2b;
  --muted:#777;
  --radius:14px;
}
*{box-sizing:border-box;font-family:"Segoe UI",sans-serif}
body{margin:0;background:var(--bg);color:var(--text)}
header{text-align:center;padding:28px 20px}
header h1{margin:0;color:var(--primary)}
header p{color:var(--muted);font-size:14px}
.container{max-width:500px;margin:auto;padding:0 16px 40px}
.card{
  background:var(--card);
  padding:20px;
  border-radius:var(--radius);
  box-shadow:0 10px 30px rgba(0,0,0,.05)
}
label{font-size:13px;color:var(--muted);margin-bottom:6px;display:block}
select,input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  margin-bottom:14px
}
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:var(--primary);
  color:#fff;
  font-size:15px;
  cursor:pointer
}
.payment{text-align:center;color:var(--muted);font-size:14px;margin-top:18px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
</style>
</head>

<body>

<header>
  <h1>Lylow Store</h1>
  <p>Top Up Game Aman & Terpercaya</p>
</header>

<div class="container">
<div class="card">

<label>Game</label>
<select id="game" onchange="toggleServer()">
  <option value="">-- Pilih Game --</option>
  <option value="Mobile Legends">Mobile Legends</option>
  <option value="PUBG Mobile">PUBG Mobile</option>
  <option value="Honor of Kings">Honor of Kings</option>
</select>

<label>ID Player</label>
<input type="text" id="userid" placeholder="Contoh: 12345678">

<div id="serverBox">
<label>Server</label>
<input type="text" id="server" placeholder="Contoh: 4321">
</div>

<label>Nominal</label>
<select id="nominal" onchange="setHarga()">
  <option value="">-- Pilih Nominal --</option>
  <option value="86 Diamond">86 Diamond</option>
  <option value="172 Diamond">172 Diamond</option>
  <option value="257 Diamond">257 Diamond</option>
</select>

<label>Harga</label>
<input type="text" id="harga" readonly placeholder="Harga otomatis">

<button class="btn" onclick="orderWA()">Order via WhatsApp</button>

<div class="payment">
Metode pembayaran:<br>
DANA • OVO • GoPay
</div>

</div>

<footer>© 2026 Lylow Store</footer>
</div>

<script>
const priceList = {
  "86 Diamond": "Rp 23.000",
  "172 Diamond": "Rp 45.000",
  "257 Diamond": "Rp 65.000"
};

function setHarga(){
  const nominal = document.getElementById("nominal").value;
  document.getElementById("harga").value = priceList[nominal] || "";
}

function toggleServer(){
  const game = document.getElementById("game").value;
  document.getElementById("serverBox").style.display =
    game === "Honor of Kings" ? "none" : "block";
}

  const game = gameEl.value;
  const id = userid.value;

  const nominal = document.getElementById("nominal").value;
  const harga = document.getElementById("harga").value;

  const text =
`Halo admin, saya mau top up

Game   : ${game}

  );

</script>

</body>
</html>
